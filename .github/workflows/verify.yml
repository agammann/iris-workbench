name: Verify IRIS Workbench
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iris-workbench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-spec.mjs
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:sites
      - run: python -m unittest discover -s tests -p test_logs.py -v
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm audit
      - run: pnpm package:release
      - run: pnpm test:consumer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: iris-workbench-release
          path: release-artifacts/
          if-no-files-found: error
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IRIS_CONTAINER: iris-workbench-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-spec.mjs
      - run: pnpm build
      - name: Initialize a disposable pinned IRIS instance
        env:
          WORKBENCH_STATE_DIR: ${{ runner.temp }}/iris-workbench-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/setup-local.mjs
      - name: Verify the real configured sign-in and read path
        env:
          WORKBENCH_STATE_DIR: ${{ runner.temp }}/iris-workbench-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/verify-local.mjs "$WORKBENCH_STATE_DIR"
      - name: Remove only this job's disposable instance and private state
        if: always()
        env:
          WORKBENCH_STATE_DIR: ${{ runner.temp }}/iris-workbench-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker rm --force "$IRIS_CONTAINER" > /dev/null 2>&1 || true
          rm -rf -- "$WORKBENCH_STATE_DIR"
  publish:
    needs: [verify, verify-live]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iris-workbench-release
          path: release-artifacts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { default: publish } = await import(process.env.GITHUB_WORKSPACE + '/scripts/release.mjs');
            await publish({ github, context, core });
